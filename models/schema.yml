
version: 2

sources:
  - name: raw
    description: "GreenWeez ham veri kaynakları"
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Ham satış verileri"
        config:
          loaded_at_field: "CAST(date_date AS TIMESTAMP)"
          freshness:
            warn_after:
              count: 90
              period: day
       

      - name: product
        identifier: raw_gz_product
        description: "Ham ürün verileri"

      - name: ship
        identifier: raw_gz_ship
        description: "Ham gönderim verileri"

      - name: adwords
        identifier: raw_gz_adwords
        description: "Google Adwords reklam verileri"

      - name: bing
        identifier: raw_gz_bing
        description: "Bing reklam verileri"

      - name: criteo
        identifier: raw_gz_criteo
        description: "Criteo reklam verileri"

      - name: facebook
        identifier: raw_gz_facebook
        description: "Facebook reklam verileri"



models:
  - name: stg_raw__product
    description: "Düzenlenmiş ürün verileri"
    columns:
      - name: products_id
        description: "Ürünün kimliği"
        tests:
          - unique
          - not_null
      - name: purchase_price
        description: "Ürünün satın alma maliyeti"

  - name: stg_raw__sales
    description: "Düzenlenmiş satış verileri"
    columns:
      - name: date_date
        description: "Satış tarihi"
      - name: orders_id
        description: "Sipariş kimliği"
      - name: products_id
        description: "Satılan ürünün kimliği"
      - name: revenue
        description: "Satış geliri"
      - name: quantity
        description: "Satılan ürün miktarı"

  - name: stg_raw__ship
    description: "Düzenlenmiş gönderim verileri"
    columns:
      - name: orders_id
        description: "Sipariş kimliği"
        tests:
          - unique
          - not_null
      - name: shipping_fee
        description: "Gönderim ücreti"
      - name: logcost
        description: "Lojistik maliyeti"
      - name: ship_cost
        description: "Gönderim maliyeti"

  -  name: stg_raw__adwords
     description: "Temizlenmiş Adwords reklam verileri"
     columns:
      - name: campaign_name
        description: "Reklam kampanyasının adı"
      - name: ads_cost
        description: "Reklam maliyeti (FLOAT64)"

  - name: stg_raw__bing
    columns:
      - name: campaign_name
      - name: ads_cost

  - name: stg_raw__criteo
    columns:
      - name: campaign_name
      - name: ads_cost

  - name: stg_raw__facebook
    columns:
      - name: campaign_name
      - name: ads_cost
      
  - name: int_campaigns
    description: "Dört reklam platformunun kampanya verilerini birleştiren ara model."
    columns:
      - name: campaign_id
        description: "Kampanya için benzersiz anahtar."
        tests:
          - unique
          - not_null

      - name: date_date
        description: "Reklam kampanyasının tarihi."
        tests:
          - not_null

      - name: paid_source
        description: "Reklam platformu."
        tests:
          - not_null

      - name: campaign_key
        description: "Reklam kampanyasının kaynak sistemdeki anahtarı."
        tests:
          - not_null

      - name: campaign_name
        description: "Reklam kampanyasının adı."

      - name: ads_cost
        description: "Reklam maliyeti."

      - name: impression
        description: "Reklam gösterim sayısı."

      - name: click
        description: "Reklam tıklama sayısı."