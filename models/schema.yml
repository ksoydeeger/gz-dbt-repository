
version: 2

sources:
  - name: raw
    description: "GreenWeez ham veri kaynakları"
    schema: gz_raw_data
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: "Ham satış verileri"
        loaded_at_field: date_date
        freshness:
          warn_after:
            count: 90
            period: day

      - name: product
        identifier: raw_gz_product
        description: "Ham ürün verileri"

      - name: ship
        identifier: raw_gz_ship
        description: "Ham gönderim verileri"

models:
  - name: stg_raw__product
    description: "Düzenlenmiş ürün verileri"
    columns:
      - name: products_id
        description: "Ürünün kimliği"
        tests:
          - unique
          - not_null
      - name: purchase_price
        description: "Ürünün satın alma maliyeti"

  - name: stg_raw__sales
    description: "Düzenlenmiş satış verileri"
    columns:
      - name: date_date
        description: "Satış tarihi"
      - name: orders_id
        description: "Sipariş kimliği"
      - name: products_id
        description: "Satılan ürünün kimliği"
      - name: revenue
        description: "Satış geliri"
      - name: quantity
        description: "Satılan ürün miktarı"

  - name: stg_raw__ship
    description: "Düzenlenmiş gönderim verileri"
    columns:
      - name: orders_id
        description: "Sipariş kimliği"
        tests:
          - unique
          - not_null
      - name: shipping_fee
        description: "Gönderim ücreti"
      - name: logcost
        description: "Lojistik maliyeti"
      - name: ship_cost
        description: "Gönderim maliyeti"
